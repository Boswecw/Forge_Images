[package]
name = "forgeimages-tauri"
version = "1.0.0"
edition = "2024"
description = "ForgeImages Tauri integration — IPC commands for AuthorForge desktop"
license = "Proprietary"
authors = ["Boswell Digital Solutions LLC"]

[lib]
name = "forgeimages_tauri"
path = "src/lib.rs"

[dependencies]
forgeimages-core = { path = "../forgeimages-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
